name: Deliver existing r39 APK
on:
  push:
    branches: [feat/r34-blender-direct-d-drive]
    paths: [.github/workflows/deliver-r39.yml]
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Resolve download for the existing verified r39 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request(
              'https://api.github.com/repos/Frane12/EmuExperimental/releases/assets/654901075',
              headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
                       'Accept': 'application/octet-stream',
                       'X-GitHub-Api-Version': '2022-11-28'})
          try:
              urllib.request.build_opener(NoRedirect).open(request,timeout=30)
              raise RuntimeError('Expected asset redirect')
          except urllib.error.HTTPError as response:
              if response.code not in (301,302,303,307,308):
                  raise
              location=response.headers['Location']
              if not location.startswith('https://'):
                  raise RuntimeError('Expected HTTPS download')
              print('DRNAS_APK_DOWNLOAD_URL='+location)
          PY
