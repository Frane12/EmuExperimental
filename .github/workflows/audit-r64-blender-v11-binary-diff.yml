name: AUDIT ONLY - Blender 4.5.14 official v1.1 vs Mali R64 ZIP (no build)
on:
  push:
    branches:
      - audit/r64-blender-binaries-20261020
    paths:
      - ".github/workflows/audit-r64-blender-v11-binary-diff.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    name: Verify immutable archives and compare all decompressed files (no compilation)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout read-only private comparison script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve and SHA256-verify public official Blender 4.5.14 Windows ARM64 ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender-audit"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 25 --max-time 1800 \
            --user-agent 'Mozilla/5.0 DRNAS-Blender-Audit-v4.5.14' \
            'https://download.blender.org/release/Blender4.5/blender-4.5.14-windows-arm64.zip' \
            --output "$RUNNER_TEMP/blender-audit/official.zip"
          echo '0153ecefc96a0e23985e6edcdbe04e909ba2078258f4ff6a05c21d4b7c756911  '"$RUNNER_TEMP"'/blender-audit/official.zip' | sha256sum -c -
      - name: Retrieve and SHA256-verify released PRIVATE R64 Mali Blender ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 'blender-r64-native-39362488049-1' \
            --repo Frane12/EmuExperimental \
            --pattern 'Blender-4.5.14-DRNAS-MaliVulkan-r64-WindowsARM64-NATIVE-PRIVATE.zip' \
            --dir "$RUNNER_TEMP/blender-audit" --clobber
          mv "$RUNNER_TEMP/blender-audit/Blender-4.5.14-DRNAS-MaliVulkan-r64-WindowsARM64-NATIVE-PRIVATE.zip" \
             "$RUNNER_TEMP/blender-audit/mali.zip"
          echo '8802767f9ac63a6e8054e6e37b3ba994b49c2fb6d37d34cfc50ae48491851d6f  '"$RUNNER_TEMP"'/blender-audit/mali.zip' | sha256sum -c -
      - name: Run file-by-file SHA256 + PE header and section forensic comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_blender_archives.py
          python3 tools/audit_blender_archives.py \
            "$RUNNER_TEMP/blender-audit/official.zip" \
            "$RUNNER_TEMP/blender-audit/mali.zip" \
            "$RUNNER_TEMP/blender-audit/output"
          cat "$RUNNER_TEMP/blender-audit/output/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save private text-only forensic report (never binary archives)
        uses: actions/upload-artifact@v4
        with:
          name: r64-blender-official-v11-mali-r64-inventory
          path: |
            ${{ runner.temp }}/blender-audit/output/summary.md
            ${{ runner.temp }}/blender-audit/output/all_files_diff.csv
            ${{ runner.temp }}/blender-audit/output/report.json
          retention-days: 30
