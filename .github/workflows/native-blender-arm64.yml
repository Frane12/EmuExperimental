name: Native Blender ARM64 - NDK feasibility
on:
  push:
    branches: [experiment/drnas-native-arm64-blender]
    paths:
      - ".github/workflows/native-blender-arm64.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK and build tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018"
      - name: Compile real Android AArch64 ELF smoke test
        run: |
          set -euxo pipefail
          mkdir -p native-results
          cat > native-results/arm64_smoke.c <<'EOF'
          #include <stdio.h>
          int main(void) { puts("DRNAS Android ARM64 native ELF"); return 0; }
          EOF
          CC="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -fPIE -pie native-results/arm64_smoke.c -o native-results/drnas-arm64-smoke
          file native-results/drnas-arm64-smoke | tee native-results/elf-file.txt
          readelf -h native-results/drnas-arm64-smoke | tee native-results/elf-header.txt
          grep -q 'Machine:.*AArch64' native-results/elf-header.txt
      - name: Cross-compile libjpeg-turbo for Android ARM64
        run: |
          set -euxo pipefail
          mkdir -p native-results
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 --branch 3.1.2 https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/libjpeg-turbo
          cmake -S /tmp/libjpeg-turbo -B /tmp/jpeg-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_INSTALL_PREFIX=/tmp/android-deps \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
            -DWITH_TURBOJPEG=OFF -DWITH_TOOLS=OFF -DWITH_TESTS=OFF \
            -DWITH_SIMD=OFF
          cmake --build /tmp/jpeg-build --parallel 4
          cmake --install /tmp/jpeg-build
          test -f /tmp/android-deps/include/jpeglib.h
          find /tmp/android-deps -name 'libjpeg*.a' -print
          file /tmp/android-deps/lib/libjpeg.a
      - name: Cross-compile libpng for Android ARM64
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.6.44 https://github.com/pnggroup/libpng.git /tmp/libpng-src
          cmake -S /tmp/libpng-src -B /tmp/png-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_INSTALL_PREFIX=/tmp/android-deps \
            -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF \
            -DPNG_EXECUTABLES=OFF -DPNG_HARDWARE_OPTIMIZATIONS=OFF
          cmake --build /tmp/png-build --parallel 4
          cmake --install /tmp/png-build
          test -f /tmp/android-deps/include/png.h
          test -f /tmp/android-deps/lib/libpng16.a
      - name: Cross-compile zstd for Android ARM64
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.5.7 https://github.com/facebook/zstd.git /tmp/zstd-src
          cmake -S /tmp/zstd-src/build/cmake -B /tmp/zstd-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_INSTALL_PREFIX=/tmp/android-deps \
            -DZSTD_BUILD_SHARED=OFF -DZSTD_BUILD_STATIC=ON \
            -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF
          cmake --build /tmp/zstd-build --parallel 4
          cmake --install /tmp/zstd-build
          test -f /tmp/android-deps/include/zstd.h
          test -f /tmp/android-deps/lib/libzstd.a
      - name: Cross-compile libepoxy for Android ARM64
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends meson pkg-config python3-mako
          git clone --depth 1 --branch 1.5.10 https://github.com/anholt/libepoxy.git /tmp/libepoxy-src
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > /tmp/android-arm64-meson.ini <<EOF
          [binaries]
          c = '$NDK/aarch64-linux-android26-clang'
          cpp = '$NDK/aarch64-linux-android26-clang++'
          ar = '$NDK/llvm-ar'
          strip = '$NDK/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          [built-in options]
          default_library = 'static'
          EOF
          meson setup /tmp/epoxy-build /tmp/libepoxy-src \
            --cross-file /tmp/android-arm64-meson.ini \
            --prefix=/tmp/android-deps -Dtests=false -Degl=yes -Dglx=no -Dx11=false
          meson compile -C /tmp/epoxy-build
          meson install -C /tmp/epoxy-build
          test -f /tmp/android-deps/include/epoxy/gl.h
          find /tmp/android-deps/lib -name '*epoxy*' -print
      - name: Cross-compile Brotli and FreeType for Android ARM64
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.1.0 https://github.com/google/brotli.git /tmp/brotli-src
          cmake -S /tmp/brotli-src -B /tmp/brotli-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_INSTALL_PREFIX=/tmp/android-deps -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF -DBROTLI_DISABLE_TESTS=ON
          cmake --build /tmp/brotli-build --parallel 4
          cmake --install /tmp/brotli-build
          git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git /tmp/freetype-src
          export PKG_CONFIG_LIBDIR=/tmp/android-deps/lib/pkgconfig
          cmake -S /tmp/freetype-src -B /tmp/freetype-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_INSTALL_PREFIX=/tmp/android-deps -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DFT_REQUIRE_BROTLI=ON -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BZIP2=ON \
            -DPNG_PNG_INCLUDE_DIR=/tmp/android-deps/include \
            -DPNG_LIBRARY=/tmp/android-deps/lib/libpng16.a \
            -DBROTLIDEC_INCLUDE_DIRS=/tmp/android-deps/include \
            "-DBROTLIDEC_LIBRARIES=/tmp/android-deps/lib/libbrotlidec.a;/tmp/android-deps/lib/libbrotlicommon.a"
          cmake --build /tmp/freetype-build --parallel 4
          cmake --install /tmp/freetype-build
          test -f /tmp/android-deps/lib/libfreetype.a
          grep -q '^#define FT_CONFIG_OPTION_USE_BROTLI' /tmp/android-deps/include/freetype2/freetype/config/ftoption.h
      - name: Probe pinned Blender source configure against Android NDK
        run: |
          set +e
          set -uo pipefail
          mkdir -p native-results
          if GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch v4.5.4 https://github.com/blender/blender.git /tmp/blender-src > native-results/clone.log 2>&1; then
            clone_rc=0
          else
            clone_rc=$?
          fi
          tail -n 35 native-results/clone.log
          echo "clone_exit=$clone_rc" | tee native-results/summary.txt
          if [ "$clone_rc" -ne 0 ]; then echo "::error::Blender source checkout failed"; exit "$clone_rc"; fi
          git -C /tmp/blender-src rev-parse HEAD >> native-results/summary.txt
          cmake -S /tmp/blender-src -B /tmp/blender-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DWITH_HEADLESS=ON -DWITH_GHOST_X11=OFF -DWITH_GHOST_WAYLAND=OFF \
            -DWITH_VULKAN_BACKEND=OFF \
            -DWITH_OPENIMAGEIO=OFF \
            -DWITH_CYCLES=OFF -DWITH_PYTHON=OFF -DWITH_AUDASPACE=OFF \
            -DWITH_LIBS_PRECOMPILED=OFF \
            -DJPEG_INCLUDE_DIR=/tmp/android-deps/include \
            -DJPEG_LIBRARY=/tmp/android-deps/lib/libjpeg.a \
            -DPNG_PNG_INCLUDE_DIR=/tmp/android-deps/include \
            -DPNG_LIBRARY=/tmp/android-deps/lib/libpng16.a \
            -DZSTD_INCLUDE_DIR=/tmp/android-deps/include \
            -DZSTD_LIBRARY=/tmp/android-deps/lib/libzstd.a \
            -DFREETYPE_INCLUDE_DIR_freetype2=/tmp/android-deps/include/freetype2 \
            -DFREETYPE_INCLUDE_DIR_ft2build=/tmp/android-deps/include/freetype2 \
            -DFREETYPE_LIBRARY_RELEASE=/tmp/android-deps/lib/libfreetype.a \
            -DEpoxy_INCLUDE_DIR=/tmp/android-deps/include \
            -DEpoxy_LIBRARY=/tmp/android-deps/lib/libepoxy.a \
            > native-results/blender-configure.log 2>&1
          rc=$?
          echo "blender_configure_exit=$rc" >> native-results/summary.txt
          tail -n 100 native-results/blender-configure.log
          # CMake configure failures must fail the job; logs stay visible.
          exit "$rc"
      - name: Print feasibility summary in job log (artifact quota independent)
        if: always()
        run: |
          cat native-results/summary.txt 2>/dev/null || true
          tail -n 70 native-results/clone.log 2>/dev/null || true
          tail -n 100 native-results/blender-configure.log 2>/dev/null || true
