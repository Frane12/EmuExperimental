name: Blender fullscreen and input regression checks
on:
  push:
    branches: [fix/blender-fullscreen-input-coordination]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fullscreen ownership transitions
        run: python3 -m unittest discover -s tests -p 'test_blender_window_layout.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android sources and run input routing regressions
        run: >
          gradle -p android-app testDebugUnitTest
          --tests 'au.com.darkside.xserver.Blender*'
          --tests 'au.com.darkside.xserver.PointerMappingTest'
          --tests 'au.com.darkside.xserver.X11ButtonStateTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullscreen-input-test-results
          path: android-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
