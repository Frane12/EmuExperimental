name: DRNAS one-time diagnostic build (requires offline signing)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-for-offline-signing.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android build tools and NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and build (ephemeral CI debug key; DO NOT INSTALL)
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Collect unsigned-for-distribution input and offline signing tool
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          mkdir -p "$RUNNER_TEMP/signable"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/signable/DRNAS-TRANSIENT-DO-NOT-INSTALL.apk"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/signable/apksigner.jar"
          sha256sum "$RUNNER_TEMP/signable/"*
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-v0.5.2-UNTRUSTED-TRANSIENT-for-offline-signing
          path: ${{ runner.temp }}/signable/
          if-no-files-found: error
          retention-days: 1
