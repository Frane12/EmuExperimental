name: EmuDrnas preAlpha 0.1 - Android glass dashboard and 5s render profiling
on:
  push:
    branches:
      - main
      - feat/bundled-runtime-autostart
      - experiment/proton11-anon-pe-v0.5.16
      - feat/explorer-desktop-1280x720-v0.5.17
      - feat/wine-power-progress-taskbar-touch-v0.5.18
      - feat/desktop-audio-turnip-reset-v0.5.19
      - feat/persistent-prefix-mono-vcredist-live-rdrive-v0.5.26
      - feat/hwui-cursor-dxvk-probe-v0.5.26
      - feat/keyboard-crash-logs-v0.5.26
      - feat/ime-fallback-focus-v0.5.27
      - feat/crysis-windowed-crash-diagnostics-v0.5.28
      - feat/turnip-cube-v0.5.29
      - fix/x11-window-present-v0.5.33
      - fix/turnip-autotuner-v0.5.34
      - fix/x11-framing-fex-performance-v0.5.36
      - fix/x11-dependency-diagnostics-v0.5.37
      - experiment/dxvk-fifo-wsi-v0.5.38
      - experiment/first-present-teardown-v0.5.39
      - experiment/wsi-mode-diagnostics-v0.5.44
      - feat/emudrnas-prealpha-glass-ui-v0.5.51
    paths:
      - "android-app/**"
      - "tools/package_gui_runtime.py"
      - "tools/package_bundled_runtime.py"
      - "tools/package_audio_runtime.py"
      - "tools/graphics-tests/**"
      - "tests/test_turnip_bundle.py"
      - "tests/test_xinput_build_sources.py"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Use installed Android NDK and CMake
        run: |
          test -f "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          test -f "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Embed pinned Proton 11.0-2 ARM64EC, FEX 2609 and DXVK 1.10.3
        run: |
          python3 -m py_compile tools/package_bundled_runtime.py
          python3 tools/package_bundled_runtime.py android-app/app/src/main/assets
      - name: Bundle pinned Wine Mono 11.3.0 ARM64 for automatic first-run setup
        run: |
          curl -fL --retry 3 --retry-delay 3 \
            "https://github.com/wine-mono/wine-mono/releases/download/wine-mono-11.3.0/wine-mono-11.3.0-arm64.msi" \
            -o android-app/app/src/main/assets/wine-mono.msi
          echo "b0c47d374efaf22cbff76cb10488ac2d1627b067e085aef7acec573884120e0f  android-app/app/src/main/assets/wine-mono.msi" | sha256sum --check
      - name: Bundle pinned Bionic X11 and font dependencies plus loader probe
        run: |
          python3 tools/package_gui_runtime.py "$RUNNER_TEMP/imagefs_bionic.txz" android-app/app/src/main/assets/gui-runtime-v1.zip
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" -Wall -Wextra -Werror -fPIE -pie -Wl,-z,max-page-size=16384 android-app/app/src/main/cpp/gui_dependency_probe.c -ldl -o android-app/app/src/main/jniLibs/arm64-v8a/libdrnas_gui_probe.so
      - name: Bundle pinned Android PulseAudio and AAudio output
        run: |
          python3 tools/package_audio_runtime.py android-app/app/src/main
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" -Wall -Wextra -Werror -fPIE -pie -Wl,-z,max-page-size=16384 android-app/app/src/main/cpp/vulkan_device_probe.c -ldl -pthread -o android-app/app/src/main/jniLibs/arm64-v8a/libdrnas_vulkan_probe.so
          readelf -d android-app/app/src/main/jniLibs/arm64-v8a/libpulse*.so | grep NEEDED
      - name: Build source-owned D3D9 cube diagnostic for Wine WOW64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
          mkdir -p android-app/app/src/main/assets/graphics-tests
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -mwindows -static-libgcc tools/graphics-tests/TestD3D.c -ld3d9 -lgdi32 -luser32 -lm -o android-app/app/src/main/assets/graphics-tests/TestD3D.exe
          python3 -c "import hashlib,pathlib; p=pathlib.Path('android-app/app/src/main/assets/graphics-tests/TestD3D.exe'); p.with_suffix('.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest())"
          file android-app/app/src/main/assets/graphics-tests/TestD3D.exe
      - name: Build source-owned Windows XInput 32/64-bit bridge and guest probe
        run: |
          set -euxo pipefail
          mkdir -p android-app/app/src/main/assets/xinput/x86 android-app/app/src/main/assets/xinput/x64
          for dll in xinput1_3 xinput1_4 xinput9_1_0; do
            sed "s/xinput1_3/${dll}/g" tools/graphics-tests/xinput1_3.def > "$RUNNER_TEMP/${dll}.def"
            i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror \
              -shared -Wl,--kill-at -o "android-app/app/src/main/assets/xinput/x86/${dll}.dll" \
              tools/graphics-tests/DrnasXInput.c "$RUNNER_TEMP/${dll}.def"
            x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror \
              -shared -Wl,--kill-at -o "android-app/app/src/main/assets/xinput/x64/${dll}.dll" \
              tools/graphics-tests/DrnasXInput.c "$RUNNER_TEMP/${dll}.def"
            for arch in x86 x64; do
              path="android-app/app/src/main/assets/xinput/${arch}/${dll}.dll"
              sha256sum "$path" | cut -d' ' -f1 > "$path.sha256"
              file "$path"
            done
          done
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -mwindows \
            tools/graphics-tests/XInputProbe.c -luser32 -o android-app/app/src/main/assets/xinput/XInputProbe.exe
          i686-w64-mingw32-objdump -p android-app/app/src/main/assets/xinput/x86/xinput1_3.dll | grep 'XInputGetState'
          x86_64-w64-mingw32-objdump -p android-app/app/src/main/assets/xinput/x64/xinput1_3.dll | grep 'XInputGetState'
          python3 tests/test_xinput_build_sources.py
      - name: Test scoped XCB Present guard
        run: python3 tests/test_xcb_present_guard.py
      - name: Test pinned Turnip packaging policy
        run: python3 -m unittest discover -s tests -p 'test_turnip_bundle.py'
      # X11PixelCodecTest is included in the JVM regression step.
      - name: Run JVM regression tests before checking signing secrets
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Restore persistent signing key
        env:
          DRNAS_KEYSTORE_BASE64: ${{ secrets.DRNAS_KEYSTORE_BASE64 }}
          DRNAS_STORE_PASSWORD: ${{ secrets.DRNAS_KEYSTORE_PASSWORD }}
          DRNAS_KEY_ALIAS: ${{ secrets.DRNAS_KEY_ALIAS }}
          DRNAS_KEY_PASSWORD: ${{ secrets.DRNAS_KEY_PASSWORD }}
        run: |
          if [[ -z "$DRNAS_KEYSTORE_BASE64" || -z "$DRNAS_STORE_PASSWORD" || -z "$DRNAS_KEY_ALIAS" || -z "$DRNAS_KEY_PASSWORD" ]]; then
            echo "::warning::No stable key: producing a side-by-side Drnas Console LAB APK with ephemeral certificate."
            echo "DRNAS_SIGNING_MODE=transient" >> "$GITHUB_ENV"
          else
            printf '%s' "$DRNAS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/drnas-signing.p12"
            chmod 600 "$RUNNER_TEMP/drnas-signing.p12"
            keytool -list -keystore "$RUNNER_TEMP/drnas-signing.p12" -storepass "$DRNAS_STORE_PASSWORD" -alias "$DRNAS_KEY_ALIAS" >/dev/null
            echo "DRNAS_SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/drnas-signing.p12" >> "$GITHUB_ENV"
            echo "DRNAS_SIGNING_MODE=stable" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK with available signing mode
        working-directory: android-app
        env:
          DRNAS_SIGNING_STORE_PASSWORD: ${{ secrets.DRNAS_KEYSTORE_PASSWORD }}
          DRNAS_SIGNING_KEY_ALIAS: ${{ secrets.DRNAS_KEY_ALIAS }}
          DRNAS_SIGNING_KEY_PASSWORD: ${{ secrets.DRNAS_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK contains native ARM64 host and Android manifest
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          file android-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep -E 'AndroidManifest.xml|classes.dex'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep runtime-components-v1.json
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep wine-mono.msi
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep graphics-tests/TestD3D.exe
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep xinput/x86/xinput1_3.dll
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep xinput/x64/xinput1_3.dll
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep xinput/XInputProbe.exe
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep bundled/proton-11.0-2-arm64ec.wcp
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep bundled/FEXCore-2609.wcp
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep bundled/dxvk_1.10.3.wcp
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdrnas_host.so'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdrnas_wine_nls.so'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdrnas_wine_child_exec.so'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdrnas_xcb_present_guard.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Stage EmuDrnas preAlpha APK and explicit signing status
        run: |
          mkdir -p "$RUNNER_TEMP/drnas-distribution"
          if [[ "$DRNAS_SIGNING_MODE" == "stable" ]]; then
            cp android-app/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/drnas-distribution/EmuDrnas-preAlpha-0.1-STABLE-SIGNED.apk"
            cat > "$RUNNER_TEMP/drnas-distribution/README-SIGNING.txt" <<'EOF'
          EmuDrnas preAlpha 0.1
          Certificate: persistent project signing key supplied through GitHub Actions secrets.
          Package: com.drnas.console
          versionCode: 66

          Future updates can install over this app if the same certificate, applicationId
          and an increased versionCode are retained. To upgrade an older stable app,
          verify its signing certificate matches and its versionCode is lower.
          EOF
          else
            cp android-app/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/drnas-distribution/EmuDrnas-preAlpha-0.1-TRANSIENT-LAB-DO-NOT-UPGRADE.apk"
            cat > "$RUNNER_TEMP/drnas-distribution/README-SIGNING.txt" <<'EOF'
          EmuDrnas preAlpha 0.1 — private test build
          Certificate: TRANSIENT runner debug signing key. NOT persistent.
          Package: com.drnas.console.prealpha01lab

          This APK intentionally installs alongside existing builds and DOES NOT
          support in-place upgrades. Never delete your installed working version
          to test it. Future upgradeable releases require securely configured
          DRNAS_KEYSTORE_BASE64, DRNAS_KEYSTORE_PASSWORD, DRNAS_KEY_ALIAS
          and DRNAS_KEY_PASSWORD secrets in repository Settings -> Actions.
          Source-only CI validation is not on-device Crysis acceptance.
          EOF
          fi
          echo "Build signing mode: $DRNAS_SIGNING_MODE"
          sha256sum "$RUNNER_TEMP/drnas-distribution/"*.apk | tee "$RUNNER_TEMP/drnas-distribution/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        id: apk-artifact
        continue-on-error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/emudrnas-prealpha-glass-ui-v0.5.51' }}
        with:
          name: EmuDrnas-preAlpha-0.1-APK-ZIP
          path: ${{ runner.temp }}/drnas-distribution/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verified APK in a private draft release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feat/emudrnas-prealpha-glass-ui-v0.5.51'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="emudrnas-prealpha-0.1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$RUNNER_TEMP/drnas-distribution/"* --draft --target "$GITHUB_SHA" --title "EmuDrnas preAlpha 0.1 - private build" --notes-file "$RUNNER_TEMP/drnas-distribution/README-SIGNING.txt"




