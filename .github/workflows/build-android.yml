name: Blender Hotfix 1.1 - private window and Mali compatibility review
on:
  push:
    branches:
      - main
      - feat/bundled-runtime-autostart
      - experiment/proton11-anon-pe-v0.5.16
      - feat/explorer-desktop-1280x720-v0.5.17
      - feat/wine-power-progress-taskbar-touch-v0.5.18
      - feat/desktop-audio-turnip-reset-v0.5.19
      - feat/persistent-prefix-mono-vcredist-live-rdrive-v0.5.26
      - feat/hwui-cursor-dxvk-probe-v0.5.26
      - feat/keyboard-crash-logs-v0.5.26
      - feat/ime-fallback-focus-v0.5.27
      - feat/crysis-windowed-crash-diagnostics-v0.5.28
      - feat/turnip-cube-v0.5.29
      - fix/x11-window-present-v0.5.33
      - fix/turnip-autotuner-v0.5.34
      - fix/x11-framing-fex-performance-v0.5.36
      - fix/x11-dependency-diagnostics-v0.5.37
      - experiment/dxvk-fifo-wsi-v0.5.38
      - experiment/first-present-teardown-v0.5.39
      - experiment/wsi-mode-diagnostics-v0.5.44
      - feat/emudrnas-fullscreen-stretch-prealpha-r4
      - feat/emudrnas-retro-shortcuts-tools-r5
      - feat/emudrnas-compact-breeze-r7
      - fix/r13-bundled-wcp-boot
      - fix/r15-desktop-launch-keys-taskbar
      - feat/winevulkan-merged-r16
      - feat/blender-vulkan-shortcuts-r17
      - fix/r18-blender-arm64-dxgi-guard
      - diagnostic/r19-native-dxgi-load-trace
      - fix/r21-blender-arm64-dxgi-stage
      - fix/r22-blender-popup-map-state
      - fix/r23-compositor-window-stability
      - fix/r24-x11-popups-geometry-fastcopy
      - feat/r25-wine11-egl-opengl-experiment
      - feat/r28-blender-shell
      - fix/r29-blender-arm64-dxgi-launch
      - fix/r30-blender-cursor-startup
      - experiment/r31-blender-mali-g52-panvk
      - feat/r32-unified-blender-mali-merged
      - feat/r33-blender-android-save-export
      - feat/r34-blender-direct-d-drive
      - experiment/neuroflow-npu-shadow-r47
    paths:
      - "android-app/**"
      - "tools/package_gui_runtime.py"
      - "tools/package_opengl_runtime.py"
      - "tools/package_bundled_runtime.py"
      - "tools/package_blender.py"
      - "tools/package_audio_runtime.py"
      - "tests/test_blender_window_layout.py"
      - "tests/test_dxvk_bundle.py"
      - "tests/test_turnip_bundle.py"
      - "tools/graphics-tests/**"
      - "tools/windows-tools/**"
      - "tests/test_turnip_bundle.py"
      - "tests/test_xinput_build_sources.py"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
# Serialize this branch; the established permanent identity is read-only here.
concurrency:
  group: blender-direct-d-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Use installed Android NDK and CMake
        run: |
          test -f "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          test -f "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Embed pinned Proton 11.0-2 ARM64EC, FEX 2609 and DXVK 1.10.3
        run: |
          python3 -m py_compile tools/package_bundled_runtime.py
          python3 tools/package_bundled_runtime.py android-app/app/src/main/assets
      - name: Bundle verified Blender 4.5.14 Windows ARM64
        run: |
          python3 tools/package_blender.py android-app/app/src/main/assets
      - name: Bundle pinned Bionic X11 and font dependencies plus loader probe
        run: |
          python3 tools/package_gui_runtime.py "$RUNNER_TEMP/imagefs_bionic.txz" android-app/app/src/main/assets/gui-runtime-v1.zip
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" -Wall -Wextra -Werror -fPIE -pie -Wl,-z,max-page-size=16384 android-app/app/src/main/cpp/gui_dependency_probe.c -ldl -o android-app/app/src/main/jniLibs/arm64-v8a/libdrnas_gui_probe.so
      - name: Bundle separately pinned Mesa EGL / Zink native libraries for OpenGL apps
        run: |
          python3 -m py_compile tools/package_opengl_runtime.py
          python3 tools/package_opengl_runtime.py android-app/app/src/main/assets/opengl-runtime-v1.zip
          unzip -t android-app/app/src/main/assets/opengl-runtime-v1.zip
      - name: Bundle independently SHA-pinned Mali-G52 PanVK Kbase r4 driver
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/assets/mali
          curl -fL --retry 3 --retry-delay 3 --max-time 180 \
            "https://github.com/JimVulkan/mali-panvk/releases/download/v1.3.0/mali-panvk-26.3.0-devel-r4.zip" \
            -o android-app/app/src/main/assets/mali/mali-panvk-26.3.0-devel-r4.zip
          echo "1bf5fdbc6fa7134100f747692436eeee5e112e640a8b5064345facbfac918787  android-app/app/src/main/assets/mali/mali-panvk-26.3.0-devel-r4.zip" | sha256sum -c -
          unzip -t android-app/app/src/main/assets/mali/mali-panvk-26.3.0-devel-r4.zip
          unzip -l android-app/app/src/main/assets/mali/mali-panvk-26.3.0-devel-r4.zip | grep -F libvulkan_panfrost.so
          unzip -l android-app/app/src/main/assets/mali/mali-panvk-26.3.0-devel-r4.zip | grep -F NOTICE.txt
      - name: Bundle additional pinned Mali drivers and dependencies
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 180 "https://github.com/JimVulkan/mali-panvk/releases/download/v1.2.0/mali-panvk-26.3.0-devel-r3.zip" -o android-app/app/src/main/assets/mali/mali-panvk-26.3.0-devel-r3.zip
          echo "a53aa1747e19e8471bb839de21b570c70a34d868206ffac852e3e684cd284167  android-app/app/src/main/assets/mali/mali-panvk-26.3.0-devel-r3.zip" | sha256sum -c -
          curl -fL --retry 3 --max-time 180 "https://github.com/LukeValen/panvk-mali-g52/releases/download/v0.0.2-alpha/PanVk-V7-0.0.2-alpha.zip" -o android-app/app/src/main/assets/mali/PanVk-V7-0.0.2-alpha.zip
          echo "a5da75ae597b23337825c5a35d480c7a7cc0c8655d35850ca5fd25b37ac78289  android-app/app/src/main/assets/mali/PanVk-V7-0.0.2-alpha.zip" | sha256sum -c -
          unzip -t android-app/app/src/main/assets/mali/mali-panvk-26.3.0-devel-r3.zip
          unzip -t android-app/app/src/main/assets/mali/PanVk-V7-0.0.2-alpha.zip
          unzip -l android-app/app/src/main/assets/mali/PanVk-V7-0.0.2-alpha.zip | grep -E 'libvulkan_panfrost.so|libc\+\+_shared.so|libdrm.so'
      - name: Test primary and auxiliary Blender window layout
        run: python3 -m unittest discover -s tests -p 'test_blender_window_layout.py'
      - name: Bundle pinned Android PulseAudio and AAudio output
        run: |
          python3 tools/package_audio_runtime.py android-app/app/src/main
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" -Wall -Wextra -Werror -fPIE -pie -Wl,-z,max-page-size=16384 android-app/app/src/main/cpp/vulkan_device_probe.c -ldl -pthread -o android-app/app/src/main/jniLibs/arm64-v8a/libdrnas_vulkan_probe.so
          readelf -d android-app/app/src/main/jniLibs/arm64-v8a/libpulse*.so | grep NEEDED
      - name: Build source-owned D3D9 cube diagnostic for Wine WOW64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
          mkdir -p android-app/app/src/main/assets/graphics-tests
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -mwindows -static-libgcc tools/graphics-tests/TestD3D.c -ld3d9 -lgdi32 -luser32 -lm -o android-app/app/src/main/assets/graphics-tests/TestD3D.exe
          python3 -c "import hashlib,pathlib; p=pathlib.Path('android-app/app/src/main/assets/graphics-tests/TestD3D.exe'); p.with_suffix('.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest())"
          file android-app/app/src/main/assets/graphics-tests/TestD3D.exe
      - name: Build source-owned Windows XInput 32/64-bit bridge and guest probe
        run: |
          set -euxo pipefail
          mkdir -p android-app/app/src/main/assets/xinput/x86 android-app/app/src/main/assets/xinput/x64
          for dll in xinput1_3 xinput1_4 xinput9_1_0; do
            sed "s/xinput1_3/${dll}/g" tools/graphics-tests/xinput1_3.def > "$RUNNER_TEMP/${dll}.def"
            i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror \
              -shared -Wl,--kill-at -o "android-app/app/src/main/assets/xinput/x86/${dll}.dll" \
              tools/graphics-tests/DrnasXInput.c "$RUNNER_TEMP/${dll}.def"
            x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror \
              -shared -Wl,--kill-at -o "android-app/app/src/main/assets/xinput/x64/${dll}.dll" \
              tools/graphics-tests/DrnasXInput.c "$RUNNER_TEMP/${dll}.def"
            for arch in x86 x64; do
              path="android-app/app/src/main/assets/xinput/${arch}/${dll}.dll"
              sha256sum "$path" | cut -d' ' -f1 > "$path.sha256"
              file "$path"
            done
          done
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -mwindows \
            tools/graphics-tests/XInputProbe.c -luser32 -o android-app/app/src/main/assets/xinput/XInputProbe.exe
          i686-w64-mingw32-objdump -p android-app/app/src/main/assets/xinput/x86/xinput1_3.dll | grep 'XInputGetState'
          x86_64-w64-mingw32-objdump -p android-app/app/src/main/assets/xinput/x64/xinput1_3.dll | grep 'XInputGetState'
          python3 tests/test_xinput_build_sources.py
      - name: Build source-owned Retro Paint and RetroPad Windows applications
        run: |
          set -euxo pipefail
          mkdir -p android-app/app/src/main/assets/windows-tools
          for app in DrnasRetroPaint DrnasRetroPad; do
            i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror \
              -municode -mwindows -static-libgcc \
              "tools/windows-tools/${app}.c" -luser32 -lgdi32 -lcomdlg32 \
              -o "android-app/app/src/main/assets/windows-tools/${app/DrnasRetro/DRNAS}.exe"
          done
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -municode -mwindows -static-libgcc \
            tools/windows-tools/DrnasDesktop.c -luser32 -lgdi32 -lm \
            -o android-app/app/src/main/assets/windows-tools/DRNASDesktop.exe
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -municode -mwindows -static-libgcc \
            tools/windows-tools/DrnasLinkLaunch.c -lole32 -luuid -lshell32 \
            -o android-app/app/src/main/assets/windows-tools/DRNASLinkLaunch.exe
          test -s android-app/app/src/main/assets/windows-tools/DRNASDesktop.exe
          test -s android-app/app/src/main/assets/windows-tools/DRNASLinkLaunch.exe
          test -s android-app/app/src/main/assets/windows-tools/DRNASPaint.exe
          test -s android-app/app/src/main/assets/windows-tools/DRNASPad.exe
          file android-app/app/src/main/assets/windows-tools/DRNASPaint.exe
          file android-app/app/src/main/assets/windows-tools/DRNASPad.exe
      - name: Test scoped XCB Present guard
        run: python3 tests/test_xcb_present_guard.py
      - name: Test pinned Turnip packaging policy
        run: python3 -m unittest discover -s tests -p 'test_turnip_bundle.py'
      - name: Validate both DXVK standard/async WCP payloads
        run: python3 tests/test_dxvk_bundle.py
      # X11PixelCodecTest is included in the JVM regression step.
      - name: Run JVM regression tests before checking signing secrets
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Reuse the established permanent signing identity from the PRIVATE draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Security boundary: this convenient private alpha identity store is NOT suitable
          # for public repositories. It can later be migrated to GitHub Actions Secrets.
          [[ "$GITHUB_REPOSITORY" == "Frane12/EmuExperimental" ]] || { echo "::error::Wrong repository"; exit 1; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" == "true" ]] || {
            echo "::error::Permanent signing key MUST NOT be restored or generated in a public repository."
            exit 1
          }
          identity_tag="drnas-private-signing-identity-v1"
          root="$RUNNER_TEMP/drnas-permanent-signing"
          mkdir -p "$root"
          if gh release view "$identity_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx 'true'; then
            echo "Reusing existing permanent signing certificate from private draft release."
            gh release download "$identity_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "drnas-identity-v1.tar.gz" --dir "$root"
            tar -xzf "$root/drnas-identity-v1.tar.gz" -C "$root" drnas-signing.p12 password.txt
          else
            echo "::error::Established permanent signing identity missing; refusing to generate a replacement key."
            exit 1
          fi
          password="$(cat "$root/password.txt")"
          test -n "$password"
          echo "::add-mask::$password"
          keytool -list -storetype PKCS12 -keystore "$root/drnas-signing.p12" \
            -storepass "$password" -alias drnas-stable >/dev/null
          keytool -exportcert -storetype PKCS12 -keystore "$root/drnas-signing.p12" \
            -storepass "$password" -alias drnas-stable \
            -file "$root/drnas-signing.der" >/dev/null
          cert="$(sha256sum "$root/drnas-signing.der" | cut -d' ' -f1)"
          echo "DRNAS_EXPECTED_CERT_SHA256=$cert" >> "$GITHUB_ENV"
          echo "DRNAS_SIGNING_KEYSTORE_FILE=$root/drnas-signing.p12" >> "$GITHUB_ENV"
          echo "DRNAS_SIGNING_STORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "DRNAS_SIGNING_KEY_ALIAS=drnas-stable" >> "$GITHUB_ENV"
          echo "DRNAS_SIGNING_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "DRNAS_SIGNING_MODE=stable" >> "$GITHUB_ENV"
          echo "Permanent signing certificate SHA-256: $cert"
      - name: Build APK using the reused permanent signing identity
        working-directory: android-app
        env:
          DRNAS_REQUIRE_STABLE_SIGNING: "1"
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK contains native ARM64 host and Android manifest
        if: github.event_name != 'pull_request'
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          file android-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep -E 'AndroidManifest.xml|classes.dex'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep runtime-components-v1.json
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep graphics-tests/TestD3D.exe
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep blender/blender-4.5.14-windows-arm64.zip
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep emudrnas-meadow-r6.webp
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep windows-tools/DRNASPaint.exe
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep windows-tools/DRNASPad.exe
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep windows-tools/DRNASDesktop.exe
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep windows-tools/DRNASLinkLaunch.exe
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep emudrnas-desktop-meadow-r13.webp
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep xinput/x86/xinput1_3.dll
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep xinput/x64/xinput1_3.dll
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep xinput/XInputProbe.exe
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep bundled/proton-11.0-2-arm64ec.wcp
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep bundled/FEXCore-2609.wcp
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep bundled/dxvk_1.10.3.wcp
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep bundled/Dxvk-1.10.3-async.wcp
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep bundled/Turnip-A6xx-A7xx-R6.zip
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep mali/mali-panvk-26.3.0-devel-r4.zip
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep mali/mali-panvk-26.3.0-devel-r3.zip
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep mali/PanVk-V7-0.0.2-alpha.zip
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep blender/drnas-window-layout.py
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdrnas_host.so'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdrnas_wine_nls.so'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdrnas_wine_child_exec.so'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdrnas_xcb_present_guard.so'
          if [[ "$GITHUB_REF_NAME" == "experiment/neuroflow-npu-shadow-r47" ]]; then
            unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdrnas_npu_probe.so'
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Stage stable-signed EmuDrnas preAlpha APK (updates enabled)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DRNAS_SIGNING_MODE" == stable ]] || { echo "::error::Refusing to publish non-persistent signature"; exit 1; }
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          [[ "$CERT" == "$DRNAS_EXPECTED_CERT_SHA256" ]] || { echo "::error::APK certificate mismatch; refusing distribution"; exit 1; }
          [[ "$CERT" == "393fd0522cbbf36dd17412031a62b1cc29933e5e8e9851637193c73b4eb7d67f" ]] || { echo "::error::Certificate differs from installed r5/r6"; exit 1; }
          mkdir -p "$RUNNER_TEMP/drnas-distribution"
          if [[ "$GITHUB_REF_NAME" == "experiment/neuroflow-npu-shadow-r47" ]]; then
            cp "$APK" "$RUNNER_TEMP/drnas-distribution/Blender-DRNAS-NeuroFlow-NPU-r47-STABLE-SIGNED.apk"
          else
            cp "$APK" "$RUNNER_TEMP/drnas-distribution/Blender-Hotfix-1.1-STABLE-SIGNED.apk"
          fi
          cat > "$RUNNER_TEMP/drnas-distribution/README-SIGNING.txt" <<EOF
          Blender Hotfix 1.1 - private review
          Package: com.drnas.console
          versionCode: 113
          Signing certificate SHA-256: $CERT
          Signing: persistent key from private DRNAS signing-identity draft release; NOT a runner debug key.
          In-place updates require the SAME signing certificate, SAME applicationId and a HIGHER versionCode.
          Changed: Blender Hotfix 1.1. Window correction: only the main window fills the display; auxiliary windows receive Wine-drawn title bars, close/minimize controls and bounded positions. Render View button toggles the render window. Adds PanVK r3 and G52 V7 0.0.2 with its dependencies, automatic native-probe fallback, API/model checks and cached verified choice. Mali G52/G72/G76 paths remain experimental.  Continuous left/right mouse hold and drag, larger named translucent controls with 10 percent less background opacity, automatic GPU driver selection and fallback, direct Blender launch, English default, A810 960x544 / stronger GPUs 1280x720 and a saved Resolution menu. Fixes the 92 percent startup overlay for managed Blender windows. Requests Android file access at launch if missing, then selects the project folder for drive D:. Same stable certificate and package, versionCode 113. Experimental community build; not an official Blender Android port. JVM tests and signed APK verification run in CI.
          Previous ephemeral LAB packages cannot be upgraded in place; back up app data before migration.
          EOF
          if [[ "$GITHUB_REF_NAME" == "experiment/neuroflow-npu-shadow-r47" ]]; then
            cp docs/NEUROFLOW_NPU_SHADOW_R47.md "$RUNNER_TEMP/drnas-distribution/CHANGELOG.md"
            sed -i 's/versionCode: 113/versionCode: 114/g' "$RUNNER_TEMP/drnas-distribution/README-SIGNING.txt"
            cat >> "$RUNNER_TEMP/drnas-distribution/README-SIGNING.txt" <<'EOF'
          Additional private r47 experiment: 2-second low-priority CPU shadow predictor of Android/X11 DISPLAY frame intervals, NNAPI accelerator enumeration (NOT NPU inference), user A/B toggle, unchanged GPU/Blender/WSI. Experimental, unverified on device. No neural network is running on an NPU.
          EOF
            bundle="Blender-DRNAS-NeuroFlow-NPU-r47-preview.zip"
          else
            cp releases/blender-hotfix-1.1.md "$RUNNER_TEMP/drnas-distribution/CHANGELOG.md"
            bundle="Blender-Hotfix-1.1-preview.zip"
          fi
