# REVIEW-ONLY SPECIMEN: inert while stored in .github/workflow-drafts/.
# Replaces existing workflow ONLY after a separate explicit build approval.
# No scheduled/push triggers; .github/workflows/ contains the currently active older version.
name: Blender r64 Mali Vulkan - Windows ARM64 experimental compile (reviewed v2)
# This workflow is intentionally limited to the private r64 source branch.
# It NEVER modifies the public Android Blender APK/release or Git history.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blender-r64-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-blender-arm64:
    name: Compile patched Blender 4.5.14 for Windows ARM64 (NOT an APK)
    runs-on: windows-2022
    timeout-minutes: 325
    env:
      GIT_TERMINAL_PROMPT: "0"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout private DRNAS r64 patch and scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Print host/toolchain and free disk before source checkout
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Free, Used | Format-Table
          clang-cl --version | Select-Object -First 1
          cmake --version | Select-Object -First 1
          git --version
          git lfs version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msvc = & $vswhere -latest -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$msvc) { throw 'VS2022 ARM64 targeting component missing' }
          $llvmToolset = & $vswhere -latest -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$llvmToolset) {
            throw 'VS2022 MSBuild ClangCl Toolset component missing; cannot configure -T ClangCl'
          }
          Write-Host "VS2022 ARM64 and MSBuild ClangCl components detected: $msvc"

      - name: Fetch exact upstream Blender v4.5.14 source and apply reviewed GPU patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'drnas-blender-4514-src'
          git clone -c core.longpaths=true --filter=blob:none --depth=1 --branch v4.5.14 --single-branch https://github.com/blender/blender.git $src
          if ($LASTEXITCODE -ne 0) { throw 'Blender source clone failed' }
          git -C $src checkout --detach v4.5.14
          if ($LASTEXITCODE -ne 0) { throw 'Exact Blender v4.5.14 checkout failed' }
          python tools/check_blender_mali_patch.py $src
          if ($LASTEXITCODE -ne 0) { throw 'Pinned r64 patch mismatch' }
          $patch = Join-Path $PWD.Path 'patches/blender-4.5.14-mali-vulkan-optional-features-r64.patch'
          git -C $src apply -- $patch
          if ($LASTEXITCODE -ne 0) { throw 'Blender r64 patch apply failed' }
          git -C $src diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Source whitespace/check errors' }
          git -C $src diff --stat
          # Host runner is x64; the upstream 4.5 script calls vcvarsall arm64
          # (ARM64 host!), which cannot run cl.exe on a Windows x64 runner.
          # Use VS x64-hosted tools targeting ARM64. This is BUILD-SCRIPT-ONLY;
          # the Blender GPU patch is separately verified against pristine v4.5.14.
          $vcDetect = Join-Path $src 'build_files/windows/detect_msvc_vswhere.cmd'
          $detectText = [System.IO.File]::ReadAllText($vcDetect)
          $oldCall = 'call "%VCVARS%" %BUILD_ARCH%'
          if (!$detectText.Contains($oldCall)) { throw 'Unrecognized upstream VS compiler detection; refusing unsafe rewrite' }
          $newCall = 'if "%BUILD_ARCH%" == "arm64" (call "%VCVARS%" x64_arm64) else (call "%VCVARS%" %BUILD_ARCH%)'
          $detectText = $detectText.Replace($oldCall,$newCall)
          [System.IO.File]::WriteAllText($vcDetect,$detectText)
          Write-Host 'CI host-only correction: vcvarsall x64_arm64 (VS x64 cross compiler for ARM64 target)'
          # Blender 4.5's make.bat resets BUILD_CMAKE_ARGS at each invocation,
          # so passing this flag through the environment alone would NOT work.
          # This staging-only modification affects the temporary checkout,
          # not upstream Blender or the public Android app.
          $configurePath = Join-Path $src 'build_files/windows/configure_msbuild.cmd'
          $configureText = [System.IO.File]::ReadAllText($configurePath)
          $platformNeedle = 'set BUILD_PLATFORM_SELECT=-A ARM64'
          if ($configureText.Split($platformNeedle).Count -ne 2) {
            throw 'Cannot locate unique Blender 4.5 ARM64 MSBuild platform setting'
          }
          $configureText = $configureText.Replace(
            $platformNeedle,
            $platformNeedle + [Environment]::NewLine +
            '  set DRNAS_ARM64_CMAKE_ARGS=-DCMAKE_SYSTEM_PROCESSOR:STRING=ARM64 -DLIBDIR:PATH="%BLENDER_DIR%lib/windows_arm64"')
          $argsNeedle = '%PYDEBUG_CMAKE_ARGS%'
          if ($configureText.Split($argsNeedle).Count -ne 2) {
            throw 'Cannot find unique Blender CMake argument assembly'
          }
          $configureText = $configureText.Replace(
            $argsNeedle, $argsNeedle + ' %DRNAS_ARM64_CMAKE_ARGS%')
          [System.IO.File]::WriteAllText($configurePath,$configureText)
          Write-Host 'ARM64 correction: explicit CMAKE_SYSTEM_PROCESSOR=ARM64 and pinned LIBDIR=lib/windows_arm64'

          # Safety gate: -A ARM64 alone did not ensure CMAKE_SYSTEM_PROCESSOR=ARM64.
          # Check both values INSIDE Blender's platform CMake logic, where the
          # previous run selected the incorrect windows_x64 directory.
          $platformCmake = Join-Path $src 'build_files/cmake/platform/platform_win32.cmake'
          $platformText = [System.IO.File]::ReadAllText($platformCmake)
          $anchorCmake = 'set(WINDOWS_ARM64_MIN_VSCMD_VER 17.12.3)'
          if ($platformText.Split($anchorCmake).Count -ne 2) {
            throw 'Unexpected upstream Blender 4.5 Windows CMake platform file'
          }
          $guard = @'
if(NOT CMAKE_VS_PLATFORM_NAME STREQUAL "ARM64" OR
   NOT CMAKE_SYSTEM_PROCESSOR STREQUAL "ARM64")
  message(FATAL_ERROR "DRNAS R64: refusing non-ARM64 CMake target / architecture")
endif()
if(NOT DEFINED LIBDIR OR NOT LIBDIR MATCHES "windows_arm64$")
  message(FATAL_ERROR "DRNAS R64: refusing non-ARM64 dependency libraries")
endif()
'@
          $platformText = $platformText.Replace($anchorCmake, $guard + [Environment]::NewLine + $anchorCmake)
          [System.IO.File]::WriteAllText($platformCmake,$platformText)
          Write-Host 'Fail-closed ARM64 architecture + pinned dependency checks added to temporary source'
          "BLENDER_SOURCE=$src" >> $env:GITHUB_ENV
          "BLENDER_SOURCE_COMMIT=$(git -C $src rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Fetch exact 4.5.14 Windows ARM64 library submodule and Git LFS payloads
        shell: pwsh
        timeout-minutes: 105
        run: |
          $ErrorActionPreference = 'Stop'
          $src = $env:BLENDER_SOURCE
          $root = (Get-Item $src).PSDrive.Root
          $driveName = [System.IO.Path]::GetPathRoot($src).Substring(0,1)
          $drive = Get-PSDrive -Name $driveName
          $freeGiB = [Math]::Round($drive.Free / 1GB, 1)
          Write-Host "Before libraries: $freeGiB GiB free on $driveName"
          if ($freeGiB -lt 15) {
            throw "Insufficient free disk for multi-GB Blender library download and ARM64 build (<15 GiB); host needs a larger runner."
          }
          git -C $src -c submodule.lib/windows_arm64.update=checkout submodule update --init --depth=1 -- lib/windows_arm64
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Blender lib/windows_arm64 submodule checkout failed' }
          $lib = Join-Path $src 'lib/windows_arm64'
          if (!(Test-Path (Join-Path $lib '.git'))) { throw 'Pinned Windows ARM64 dependency submodule absent' }
          $env:GIT_LFS_SKIP_SMUDGE='0'
          git -C $lib lfs pull
          if ($LASTEXITCODE -ne 0) { throw 'Upstream ARM64 dependency LFS download failed' }
          $env:GIT_LFS_SKIP_SMUDGE='1'
          git -C $src submodule status -- lib/windows_arm64
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Free, Used | Format-Table
          if ((Get-PSDrive -Name $driveName).Free -lt 6GB) {
            throw 'Less than 6GiB free after library install; stop before CMake/build.'
          }

      - name: Pin LLVM 20+ ClangCl executable independent of VS2022 path overrides
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # VS vcvarsall prepended bundled clang 19.1.5 in the failed attempt.
          # Resolve LLVM before vcvarsall and pass the exact compiler to
          # upstream find_llvm.cmd through its documented LLVM_EXE override.
          $external = Get-Command clang-cl.exe -ErrorAction Stop
          $compiler = $external.Source
          $versionLine = (& $compiler --version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0) { throw 'ClangCl executable cannot run' }
          $match = [regex]::Match($versionLine, 'version ([0-9]+)\.([0-9]+)(?:\.([0-9]+))?')
          if (!$match.Success -or [int]$match.Groups[1].Value -lt 20) {
            throw "LLVM Clang 20+ is required, got: $versionLine, executable=$compiler"
          }
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned clang-cl.exe missing' }
          "LLVM_EXE=$compiler" >> $env:GITHUB_ENV
          Write-Host "Pinned Windows LLVM: $versionLine @ $compiler"

      - name: Configure Windows ARM64 ClangCl Blender full release
        shell: pwsh
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:BLENDER_SOURCE
          try {
            & cmd.exe /d /c 'make.bat arm64 2022 clang full nobuild verbose'
            if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 ClangCl CMake configure failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          $build = Join-Path (Split-Path $env:BLENDER_SOURCE -Parent) 'build_windows_Full_arm64_vc17_Release'
          if (!(Test-Path (Join-Path $build 'Blender.sln'))) {
            throw "ARM64 Visual Studio Blender.sln missing under $build"
          }
          # Do not trust 'configured' until we have independently proved the
          # selected VS generator/target, dependency tree and compiler version.
          $cacheFile = Join-Path $build 'CMakeCache.txt'
          if (!(Test-Path $cacheFile)) { throw 'Missing CMakeCache.txt after configuration' }
          $cache = Get-Content -LiteralPath $cacheFile -Raw
          if ($cache -notmatch '(?m)^CMAKE_GENERATOR_PLATFORM:INTERNAL=ARM64\r?
          Write-Host "Configured Blender Windows ARM64: $build"

      - name: Compile and INSTALL actual Windows ARM64 Blender executable
        shell: pwsh
        timeout-minutes: 160
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:BLENDER_SOURCE
          try {
            & cmd.exe /d /c 'make.bat arm64 2022 clang full verbose'
            if ($LASTEXITCODE -ne 0) { throw "Native Blender Windows ARM64 build/INSTALL failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Verify actual built Windows ARM64 blender.exe machine type and prepare private ZIP
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:BLENDER_BUILD 'bin/Release'
          $exe = Join-Path $root 'blender.exe'
          if (!(Test-Path $exe)) { throw "Build succeeded but installed blender.exe missing: $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 4096 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) {
            throw 'Invalid Windows PE (DOS header)'
          }
          $pe = [BitConverter]::ToInt32($bytes,60)
          if ($pe -lt 64 -or $pe+6 -ge $bytes.Length -or [BitConverter]::ToUInt32($bytes,$pe) -ne 0x4550) {
            throw 'Invalid Windows PE signature'
          }
          $machine = [BitConverter]::ToUInt16($bytes,$pe+4)
          if ($machine -ne 0xAA64) { throw ('Not Windows ARM64 PE, machine=0x{0:X4}' -f $machine) }
          $out = Join-Path $env:RUNNER_TEMP 'drnas-blender-r64-distribution'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @(
            'DRNAS Blender 4.5.14 Mali GPU native Vulkan patch r64'
            "Upstream source tag: v4.5.14 / $env:BLENDER_SOURCE_COMMIT"
            'Source patch: patches/blender-4.5.14-mali-vulkan-optional-features-r64.patch'
            'Target PE machine: IMAGE_FILE_MACHINE_ARM64 0xAA64'
            "blender.exe SHA256: $exeHash"
            'TESTING-ONLY. Windows ARM64 binary, NOT an Android APK.'
            'Not GPU-validated on Mali-G68, Mali-G610 or any physical Android device.'
            'Needs GPL source + attribution when distributed outside private review.'
          )
          $manifest | Set-Content -Encoding utf8 -Path (Join-Path $out 'README.txt')
          $zip = Join-Path $out 'Blender-4.5.14-MaliVulkan-r64-WindowsARM64-PRIVATE.zip'
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw 'Full Blender distribution ZIP missing' }
          if ((Get-Item $zip).Length -ge 1900MB) { throw 'ZIP >1.9GiB, exceeds safe GitHub asset limit' }
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $zip -Leaf)" | Set-Content -Encoding ascii -Path (Join-Path $out 'SHA256SUMS.txt')
          "DRNAS_OUTPUT=$out" >> $env:GITHUB_ENV
          Write-Host "Verified actual Windows ARM64 blender.exe PE machine: 0xAA64"
          Write-Host "Full installation ZIP bytes: $((Get-Item $zip).Length)"

      - name: Store completed Windows ARM64 Blender binary in PRIVATE DRAFT only
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Frane12/EmuExperimental') { throw 'Wrong repo' }
          $private = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $private.Trim() -ne 'true') { throw 'Refusing binary upload: repository not private' }
          $tag = "blender-mali-native-r64-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $folder = $env:DRNAS_OUTPUT
          $zip = Join-Path $folder 'Blender-4.5.14-MaliVulkan-r64-WindowsARM64-PRIVATE.zip'
          gh release create $tag $zip (Join-Path $folder 'README.txt') (Join-Path $folder 'SHA256SUMS.txt') --draft --target $env:GITHUB_SHA --title 'Blender Windows ARM64 Mali Vulkan r64 (COMPILED PRIVATE, DEVICE UNTESTED)' --notes-file (Join-Path $folder 'README.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Private build succeeded but draft release asset upload failed' }
) {
            throw 'CMake configured a non-ARM64 generator platform'
          }
          $m = [regex]::Match($cache,'(?m)^LIBDIR:PATH=(.+windows_arm64)\r?
          Write-Host "Configured Blender Windows ARM64: $build"

      - name: Compile and INSTALL actual Windows ARM64 Blender executable
        shell: pwsh
        timeout-minutes: 160
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:BLENDER_SOURCE
          try {
            & cmd.exe /d /c 'make.bat arm64 2022 clang full verbose'
            if ($LASTEXITCODE -ne 0) { throw "Native Blender Windows ARM64 build/INSTALL failed: $LASTEXITCODE" }
          } finally { Pop-Location }

