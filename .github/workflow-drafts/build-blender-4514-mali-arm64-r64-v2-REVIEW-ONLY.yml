          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $zip -Leaf)" | Set-Content -Encoding ascii -Path (Join-Path $out 'SHA256SUMS.txt')
          "DRNAS_OUTPUT=$out" >> $env:GITHUB_ENV
          Write-Host "Verified actual Windows ARM64 blender.exe PE machine: 0xAA64"
          Write-Host "Full installation ZIP bytes: $((Get-Item $zip).Length)"

